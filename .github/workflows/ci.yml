# CI 工作流：push main 与所有 PR 时自动执行格式检查、静态检查与单元测试
# 说明：
#   - 纯 Go 无 CGO，单平台 ubuntu 即可，无需 OS 矩阵
#   - Go 版本与 go.mod 声明（go 1.26.0）保持一致，低版本会编译失败，故不做多版本矩阵
#   - gofmt 仅检查根目录手写文件：api/、model/、tools/ 为生成代码，暂不纳入格式检查
#   - 兼容 Gitea Actions（1.19+）：其 WORKFLOW_DIRS 默认含 .github/workflows，语法与外部 action 引用方式相同；
#     自建实例需在仓库设置中启用 Actions，且 runner 能访问 github.com 以拉取 actions/checkout、actions/setup-go
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: 格式检查 / 静态检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt 格式检查（仅根目录手写文件）
        run: |
          unformatted=$(gofmt -l *.go)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet 静态检查
        run: go vet ./...

      - name: go test 单元测试（含竞态检测）
        run: go test -race -count=1 -timeout 300s ./...
